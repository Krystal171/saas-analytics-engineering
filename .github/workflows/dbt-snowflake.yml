
name: dbt Snowflake Integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dbt-snowflake:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-core dbt-snowflake

      - name: Configure Snowflake connection
        shell: bash
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: |
          mkdir -p ~/.dbt
          umask 077
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > ~/.dbt/rsa_key.p8

          cat > ~/.dbt/profiles.yml <<'EOF'
          saas_revenue:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
                user: "{{ env_var('SNOWFLAKE_USER') }}"
                private_key_path: /home/runner/.dbt/rsa_key.p8
                private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE') }}"
                role: SAAS_DBT_CI_ROLE
                database: SAAS_ANALYTICS
                warehouse: SAAS_WH
                schema: CI
                threads: 2
          EOF

      - name: Test Snowflake connection
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: dbt debug --profiles-dir ~/.dbt


      - name: Verify CI schema isolation
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        shell: bash
        run: |
          dbt parse --target ci --profiles-dir ~/.dbt

          python - <<'PY'
          import json

          with open("target/manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)

          models = [
              node for node in manifest["nodes"].values()
              if node["resource_type"] == "model"
              and node["package_name"] == "saas_revenue"
          ]

          if not models:
              raise SystemExit("FAIL: No project models found")

          unexpected = [
              (node["name"], node["schema"])
              for node in models
              if node["schema"].upper() != "CI"
          ]

          if unexpected:
              raise SystemExit(f"FAIL: Models outside CI schema: {unexpected}")

          print(f"PASS: All {len(models)} models target CI schema")
          PY

      - name: Build and test dbt models
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: dbt build --target ci --profiles-dir ~/.dbt
