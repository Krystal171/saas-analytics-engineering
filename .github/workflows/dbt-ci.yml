
name: dbt CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  dbt-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-snowflake

      - name: Create CI dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          saas_revenue:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: placeholder
                user: placeholder
                password: placeholder
                role: placeholder
                database: SAAS_ANALYTICS
                warehouse: SAAS_WH
                schema: STAGING
                threads: 2
          EOF

      
      - name: Validate dbt project
        run: dbt parse --profiles-dir ~/.dbt

      - name: Verify CI schema isolation
        shell: bash
        run: |
          python - <<'PY'
          import json

          with open("target/manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)

          models = [
              node for node in manifest["nodes"].values()
              if node["resource_type"] == "model"
              and node["package_name"] == "saas_revenue"
          ]

          unexpected = [
              (node["name"], node["schema"])
              for node in models
              if node["schema"].upper() != "CI"
          ]

          if unexpected:
              raise SystemExit(
                  f"Models outside CI schema: {unexpected}"
              )

          print(f"PASS: {len(models)} models target CI schema")
          PY

