
name: dbt CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  dbt-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-snowflake

      - name: Create CI dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          saas_revenue:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: placeholder
                user: placeholder
                password: placeholder
                role: placeholder
                database: SAAS_ANALYTICS
                warehouse: SAAS_WH
                schema: STAGING
                threads: 2
          EOF

      - name: Validate dbt project
        run: dbt parse --profiles-dir ~/.dbt
